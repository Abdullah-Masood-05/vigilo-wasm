[package]
name = "vigilo-wasm"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "High-performance WebAssembly proctoring stream fusion and behavioral engine in pure Rust for Bun, Node.js, and Browsers."
authors = ["Abdullah Masood"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
toml = "0.8"
thiserror = "2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
fast_image_resize = "5"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
